# Automation Studio Configuration

# License Configuration
license:
  server_url: "https://id.gmteknologi.com/modules/addons/superpos_license/lib/LicenseAPI.php"
  api_key: "16942b39fa2edbd681ab148a4d44b948"  # Isi dengan API key dari WHMCS
  verify_interval_hours: 24
  auto_verify_on_start: true
  free_mode:
    enabled: true
    daily_data_limit: 10

# Engine Configuration
engine:
  headless: false
  browser: chromium
  slow_mo: 100
  screenshot_on_error: true
  screenshot_on_step: false
  max_retries: 3
  retry_delay: 2000

# Session Configuration
session:
  mode: persistent
  persistent:
    user_data_dir: "browser_session"
  connect:
    ws_endpoint: "http://localhost:9222"

# Monitoring Configuration
monitoring:
  screenshot_on_error: true
  screenshot_on_step: false
  log_level: "INFO"

# Paths Configuration
paths:
  checkpoints: "checkpoints"
  logs: "logs"
  screenshots: "screenshots"
  workflows: "workflows"

# API Server Configuration (optional)
api:
  host: "127.0.0.1"
  port: 8000
  enabled: false